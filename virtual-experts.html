<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFAGH — Virtual Expert Workforce</title>
<style>body{margin:0;background:#020916;color:#eef7ff;font-family:Segoe UI,Tahoma,Arial;padding:24px}.wrap{max-width:1300px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.sub{color:#8fa8c2}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.card{background:#07182b;border:1px solid #173f60;border-radius:14px;padding:16px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;border:1px solid #1d694d;color:#8bf4c5}.expert{display:grid;grid-template-columns:1fr auto;gap:10px;border-top:1px solid #153956;padding:14px 0}.muted{color:#8fa8c2;font-size:11px}.btn{border:1px solid #2875a7;background:#0a2a45;color:#fff;padding:9px 13px;border-radius:9px;cursor:pointer}</style>
<div class="wrap"><div class="top"><div><h1>Virtual Expert Workforce</h1><div class="sub">Live catalog from Agent 00 runtime</div></div><button class="btn" id="refresh">Refresh</button></div>
<div class="grid"><div class="card"><div class="muted">Module</div><div id="status" class="pill">CHECKING</div></div><div class="card"><div class="muted">Active Experts</div><h2 id="count">—</h2></div><div class="card"><div class="muted">Execution Mode</div><h2>CONTROLLED</h2></div><div class="card"><div class="muted">External Side Effects</div><h2>BLOCKED</h2></div></div>
<div class="card" style="margin-top:14px"><h2>Expert Registry</h2><div id="experts">Loading…</div></div></div>
<script>async function load(){const r=await fetch('/api/v1/modules/virtual-experts',{cache:'no-store'});const d=await r.json();document.querySelector('#status').textContent=r.ok?'ACTIVE':'BLOCKED';document.querySelector('#count').textContent=d.count??0;document.querySelector('#experts').innerHTML=(d.experts||[]).map(e=>'<div class="expert"><div><b>'+e.name+'</b><div class="muted">'+e.specialty+'</div><div class="muted">Domains: '+e.domains.join(', ')+'</div><div class="muted">Skills: '+e.skills.join(', ')+'</div></div><span class="pill">'+e.status+'</span></div>').join('')||'<div class="muted">No experts registered</div>'}document.querySelector('#refresh').onclick=load;load();setInterval(load,15000)</script>
