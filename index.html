<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFAGH Virtual Office — Central Control Center</title>
<style>
:root{--bg:#07101c;--panel:#0d1929;--panel2:#11243d;--line:#1c3857;--text:#ecf5ff;--muted:#8fa8c2;--accent:#66d9ef;--good:#5ee6a8;--warn:#ffd166;--bad:#ff6b7a;--shadow:0 12px 32px rgba(0,0,0,.18)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#122847 0,#07101c 48%);color:var(--text);font-family:Inter,Segoe UI,Tahoma,sans-serif}button{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-left:1px solid var(--line);background:#06111f;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{padding:8px 10px 24px;border-bottom:1px solid var(--line);margin-bottom:14px}.brand b{display:block;font-size:15px;letter-spacing:.08em}.brand span{font-size:10px;color:var(--muted)}nav button{display:block;width:100%;border:0;background:transparent;color:var(--muted);text-align:right;padding:11px 12px;border-radius:9px;cursor:pointer;margin:3px 0}nav button:hover,nav button.active{background:var(--panel2);color:var(--text)}main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.12em}.top h1{margin:7px 0 6px;font-size:30px}.top p{margin:0;color:var(--muted);max-width:880px;line-height:1.7}.status{border:1px solid #6d3140;background:#29151e;color:#ff9cab;padding:10px 13px;border-radius:10px;font-size:11px;font-weight:800;text-align:right;line-height:1.7;min-width:190px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(13,25,41,.92);border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow)}.metric{font-size:27px;font-weight:850;margin:8px 0}.label{color:var(--muted);font-size:11px;line-height:1.7}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.section{margin-top:18px}.section h2{font-size:15px;margin:0 0 11px}.wide{grid-column:span 2}.tower{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.axis{padding:15px;background:#0a1627;border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:.18s}.axis:hover,.team-card:hover{border-color:#3c688f;transform:translateY(-1px)}.axis-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.axis h3{margin:0;font-size:14px}.axis .code{font-size:10px;color:var(--accent);font-weight:800}.axis p{margin:9px 0;color:var(--muted);font-size:11px;line-height:1.7}.axis-foot{display:flex;justify-content:space-between;gap:8px;color:#a6bbd0;font-size:10px}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;border:1px solid #5a2531;background:#25141c;color:#ff9cab}.badge.pass{border-color:#1d694d;background:#0f2d25;color:#8bf4c5}.badge.partial,.badge.in_progress,.badge.waiting_evidence,.badge.conditional{border-color:#5b4b23;background:#251f10;color:#ffe08a}.badge.blocked{border-color:#6d3140;background:#29151e;color:#ff9cab}.badge.unknown{border-color:#5b4b23;background:#251f10;color:#ffe08a}.badge.notstarted{border-color:#38485b;background:#101a26;color:#a6bbd0}.badge.open{border-color:#3b5670;background:#101e2d;color:#b9d0e6}.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.team-card{background:#0a1627;border:1px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;transition:.18s}.team-head{display:flex;justify-content:space-between;gap:8px}.team-card h3{font-size:12px;margin:0}.team-card .fa{font-size:10px;color:var(--muted);margin-top:3px}.team-meta{margin-top:9px;color:#a6bbd0;font-size:10px;line-height:1.7}.team-gates{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.gate{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#101a26;color:#b9d0e6;font-size:9px}.release{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.release-main{border:1px solid #6d3140;background:#29151e;border-radius:12px;padding:16px}.release-main h3{margin:0 0 7px}.release-main strong{font-size:22px;color:#ff9cab}.release-main p{margin:8px 0 0;color:#c5d3df;font-size:11px;line-height:1.7}.gate-list{display:grid;gap:7px}.gate-row{display:flex;justify-content:space-between;gap:10px;padding:9px;background:#0a1627;border:1px solid var(--line);border-radius:8px;font-size:10px}.matrix{display:grid;gap:9px}.matrix-row{display:grid;grid-template-columns:70px 1.1fr 110px 1.1fr;gap:10px;align-items:center;padding:10px;background:#0a1627;border:1px solid var(--line);border-radius:9px;font-size:10px}.phasebox{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.phase{padding:7px;border:1px solid var(--line);border-radius:7px;text-align:center}.phase small{display:block;color:var(--muted);margin-bottom:4px}.work-row{display:grid;grid-template-columns:70px 60px 70px 1fr 1.3fr 130px;gap:10px;align-items:start;padding:11px;background:#0a1627;border:1px solid var(--line);border-radius:9px;font-size:10px}.work-title{font-weight:800}.work-why{color:var(--muted);line-height:1.6}.work-exit{color:#b7c9da;line-height:1.6}.pill{padding:4px 7px;border-radius:999px;border:1px solid var(--line);text-align:center}.p0{color:var(--bad);border-color:#6d3140;background:#29151e}.p1{color:var(--warn);border-color:#5b4b23;background:#251f10}.p2{color:#a6bbd0;background:#101a26}.blocker{border-right:3px solid var(--bad);background:#160f18;padding:12px;margin:8px 0;border-radius:7px}.blocker b{display:block;margin-bottom:4px;font-size:12px}.blocker small{color:var(--muted);line-height:1.7}.detail{display:none}.detail.active{display:block}.detail-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.back{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 11px;border-radius:8px;cursor:pointer}.detail h2{margin:5px 0 7px;font-size:25px}.detail-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.domain{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#0a1627;margin:6px 0;font-size:11px}.snapshot{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:5px 8px;background:#0a1627;border:1px solid var(--line);border-radius:7px;color:#a6bbd0;font-size:10px}.footer{margin-top:22px;color:#71869f;font-size:10px;line-height:1.7}.mobile{display:none}@media(max-width:1050px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;border-left:0;border-bottom:1px solid var(--line)}nav{display:grid;grid-template-columns:repeat(2,1fr)}main{padding:18px}.grid,.tower,.team-grid,.release,.detail-grid,.matrix-row,.work-row{grid-template-columns:1fr}.wide{grid-column:span 1}.top,.detail-top{flex-direction:column}.mobile{display:block}.phasebox{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><b>AFAGH VIRTUAL OFFICE</b><span>CENTRAL CONTROL CENTER</span></div><nav id="nav"></nav><div class="footer">EVIDENCE-DRIVEN CONTROL PLANE<br>Unverified data is never presented as proof.</div></aside><main id="app"></main></div>
<script>
const routes={dashboard:'داشبورد مرکزی',architecture:'معماری',organizations:'سازمان‌ها',business:'Business 360',ai:'AI Workforce',workflow:'Workflow',trust:'Trust & Security',evidence:'Evidence Center',governance:'Governance'};let evidence=null,axes=[],matrix=[],work=[],teams=[];
const statusClass=s=>({PASS:'pass',PARTIAL:'partial',IN_PROGRESS:'in_progress',WAITING_EVIDENCE:'waiting_evidence',BLOCKED:'blocked',NOT_STARTED:'notstarted',OPEN:'open',UNKNOWN:'unknown',CONDITIONAL:'conditional'}[s]||'unknown');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return r.json()}
const load=async()=>{try{const [e,a,m,w,t]=await Promise.all([json('data/evidence.json'),json('data/architecture-axes.json'),json('data/phase-completion-board.json'),json('data/remaining-work-board.json'),json('data/governance-control.json')]);evidence=e;axes=a.axes||[];matrix=m.axes||[];work=w.items||[];teams=t.teams||[]}catch(err){evidence={gate:'UNKNOWN',production:'UNKNOWN',architecture_contracts:{pass:0,total:0},runtime_evidence:{pass:0,total:0},verifier:{pass:0,total:0,blockers:0},blockers:[{id:'DATA-001',title:'Control data unavailable',reason:'One or more controlled data sources could not be loaded.'}]};axes=[];matrix=[];work=[];teams=[]}render()};
function nav(r){document.getElementById('nav').innerHTML=Object.entries(routes).map(([k,v])=>`<button class="${r===k?'active':''}" data-r="${k}">${v}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>location.hash=b.dataset.r)}
function stat(label,value,cls=''){return `<div class="card"><div class="label">${label}</div><div class="metric ${cls}">${value}</div></div>`}
function phaseBox(m){return `<div class="phasebox">${['Phase 1','Phase 2/2.5','Phase 3','Phase 4'].map(p=>{const x=m?.phases?.[p]||{status:'UNKNOWN',evidence:[]};return `<div class="phase"><small>${p}</small><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span>${x.evidence?.length?`<div class="label" style="margin-top:5px">${x.evidence.map(esc).join(' · ')}</div>`:''}</div>`}).join('')}</div>`}
function overallStatus(m,a){const ps=Object.values(m?.phases||{});return ps.some(x=>x.status==='BLOCKED')?'BLOCKED':ps.some(x=>x.status==='IN_PROGRESS')?'IN_PROGRESS':m?.status||a?.status||'UNKNOWN'}
function axisCard(a){const m=matrix.find(x=>x.id===a.id);const overall=overallStatus(m,a);return `<div class="axis" data-axis="${esc(a.id)}"><div class="axis-head"><div><div class="code">${esc(a.id)}</div><h3>${esc(a.fa)} / ${esc(a.name)}</h3></div><span class="badge ${statusClass(overall)}">${esc(overall)}</span></div><p>${esc(a.purpose)}</p><div class="axis-foot"><span>Phase coverage: ${Object.keys(m?.phases||{}).length}/4</span><span>${esc(a.gate)}</span></div></div>`}
function teamCard(t){return `<div class="team-card"><div class="team-head"><div><h3>${esc(t.name)}</h3><div class="fa">${esc(t.fa)}</div></div><span class="badge ${statusClass(t.status)}">${esc(t.status)}</span></div><div class="team-meta"><b>Decision Authority:</b> ${esc(t.decision_authority)}<br><b>Next:</b> ${esc(t.next_action)}</div><div class="team-gates">${(t.open_gates||[]).map(g=>`<span class="gate">${esc(g)}</span>`).join('')}</div></div>`}
function phaseMatrix(){return `<div class="section card"><h2>Phase-by-Phase Completion Board</h2><p class="label">وضعیت هر محور در چهار فاز مستقل ثبت شده است.</p><div class="matrix">${matrix.map(x=>`<div class="matrix-row"><span>${esc(x.id)}</span><span><b>${esc(x.name)}</b><br><small class="label">${(x.remaining||[]).map(esc).join(' · ')||'No remaining items recorded'}</small></span><span class="badge ${statusClass(overallStatus(x))}">${esc(overallStatus(x))}</span><span>${phaseBox(x)}</span></div>`).join('')}</div></div>`}
function remainingBoard(){const p0=work.filter(x=>x.priority==='P0').length,p1=work.filter(x=>x.priority==='P1').length,p2=work.filter(x=>x.priority==='P2').length;return `<div class="section card"><div class="top" style="margin-bottom:12px"><div><h2 style="margin:0">Remaining Work Board</h2><div class="label">کارهای باقی‌مانده؛ مرتب‌شده بر اساس P0/P1/P2 و وابستگی فازی.</div></div><div class="snapshot"><span class="pill p0">P0 ${p0}</span><span class="pill p1">P1 ${p1}</span><span class="pill p2">P2 ${p2}</span></div></div><div class="matrix">${work.map(x=>`<div class="work-row"><span>${esc(x.id)}</span><span class="pill ${String(x.priority).toLowerCase()}">${esc(x.priority)}</span><span>${esc(x.axis)}</span><span><div class="work-title">${esc(x.title)}</div><div class="label">${(x.phase_dependency||[]).map(esc).join(' → ')}</div></span><span><div class="work-why">${esc(x.why)}</div><div class="work-exit"><b>Exit:</b> ${esc(x.exit)}</div></span><span class="badge ${statusClass(x.status)}">${esc(x.status)}<br><small>${esc(x.gate_impact)}</small></span></div>`).join('')}</div></div>`}
function dashboard(){const e=evidence||{},g=teams;return `<div id="dashboard"><div class="top"><div><div class="eyebrow">CONTROL PLANE / EVIDENCE-DRIVEN</div><h1>مرکز کنترل مرکزی AFAGH</h1><p>Dashboard از این مرحله منبع تصمیم‌گیری است: Release Gate، چهار مرجع حاکمیتی، Gateها و Evidence در یک سطح کنترل می‌شوند.</p></div><div class="status">RELEASE GATE — ${esc(e.gate||'UNKNOWN')}<br>PRODUCTION — ${esc(e.production||'UNKNOWN')}</div></div><div class="grid">${stat('Architecture Contracts',`${e.architecture_contracts?.pass??0}/${e.architecture_contracts?.total??0}`,'good')}${stat('Runtime Evidence',`${e.runtime_evidence?.pass??0}/${e.runtime_evidence?.total??0}`,'good')}${stat('Verifier',`${e.verifier?.pass??0}/${e.verifier?.total??0}`,'warn')}${stat('Active Blockers',e.verifier?.blockers??0,'bad')}</div><div class="section release"><div class="release-main"><h3>Release Gate</h3><strong>${esc(e.gate||'UNKNOWN')}</strong><p>${esc(e.gate==='PASS'?'All mandatory gates are verified.':'نسخه نهایی صادر نمی‌شود تا Gateهای اجباری و Evidence واقعی تأیید شوند.')}</p></div><div class="card"><h3 style="margin-top:0">Control Rule</h3><div class="gate-list"><div class="gate-row"><span>Evidence</span><b>Required</b></div><div class="gate-row"><span>Unverified proof</span><b class="bad">Rejected</b></div><div class="gate-row"><span>Production readiness</span><b>${esc(e.production||'UNKNOWN')}</b></div></div></div></div><div class="section grid"><div class="card wide"><h2>۱۰ محور معماری — Control Tower</h2><div class="tower">${axes.map(axisCard).join('')}</div></div><div class="card wide"><h2>Architecture & Governance Control</h2><p class="label">چهار تیم مرجع تصمیم هستند؛ وضعیت آنها از Gate و Evidence تغذیه می‌شود.</p><div class="team-grid">${g.map(teamCard).join('')}</div></div></div>${phaseMatrix()}${remainingBoard()}<div class="section card"><h2>Active Blockers</h2>${(e.blockers||[]).map(b=>`<div class="blocker"><b>${esc(b.id)} — ${esc(b.title)}</b><small>${esc(b.reason)}</small></div>`).join('')||'<div class="label">No blocker recorded.</div>'}</div><div class="footer">Reviewed HEAD: ${esc(e.reviewed_head||'unknown')} · Run #${esc(e.reviewed_run||'unknown')} · Snapshot: controlled / not live · Upstream: ${esc(e.pipeline?.upstream_connection||'unknown')}</div></div>`}
function detailPage(id){const a=axes.find(x=>x.id===id),m=matrix.find(x=>x.id===id);if(!a)return dashboard();return `<div class="detail active"><div class="detail-top"><div><div class="eyebrow">ARCHITECTURE AXIS / ${esc(a.id)}</div><h2>${esc(a.fa)}</h2><p class="label">${esc(a.purpose)}</p></div><button class="back" onclick="location.hash='dashboard'">بازگشت به Control Center</button></div>${phaseBox(m)}<div class="detail-grid"><div><div class="card"><h3>Scope</h3>${(a.domains||[]).map(d=>`<div class="domain">${esc(d)}</div>`).join('')}</div><div class="card section"><h3>Implementation</h3>${(m?.implementation||[]).map(d=>`<div class="domain">${esc(d)}</div>`).join('')||'<div class="domain">UNKNOWN</div>'}<h3 style="margin-top:16px">Verification</h3><div class="domain">${esc(m?.verification||'UNKNOWN')}</div></div><div class="card section"><h3>Gate Criterion</h3><p class="label">${esc(a.gate)}</p><div class="snapshot"><span class="tag">Current: ${esc(overallStatus(m,a))}</span><span class="tag">Remaining: ${(m?.remaining||[]).length}</span></div></div></div><div><div class="card"><h3>Remaining Work</h3>${work.filter(x=>x.axis===id).map(x=>`<div class="domain"><b>${esc(x.id)} / ${esc(x.priority)}</b> — ${esc(x.title)}<br><small class="label">${esc(x.exit)}</small></div>`).join('')||'<div class="domain">No mapped work item</div>'}</div><div class="card section"><h3>Traceability</h3><p class="label">Intent → Contract → Implementation → Verification → Evidence → Gate → Remaining Work</p></div></div></div></div>`}
function modulePage(key){const titles={architecture:'Architecture Control',organizations:'Organizations',business:'Business 360',ai:'AI Workforce',workflow:'Workflow Orchestration',trust:'Trust & Security',evidence:'Evidence Center',governance:'Governance & ADR'};return `<div class="detail active"><div class="eyebrow">MODULE</div><h2>${esc(titles[key]||key)}</h2><div class="card"><b>STATUS: DESIGN_REVIEW</b><p class="label">این ماژول در Shell محصول تعریف شده است. داده عملیاتی تنها از منبع معتبر و Evidence کنترل‌شده قابل نمایش است.</p></div></div>`}
function render(){const r=location.hash.slice(1)||'dashboard';nav(r);if(r==='dashboard')document.getElementById('app').innerHTML=dashboard();else if(r.startsWith('axis-'))document.getElementById('app').innerHTML=detailPage(r.replace('axis-',''));else document.getElementById('app').innerHTML=modulePage(r in routes?r:'dashboard');document.querySelectorAll('.axis').forEach(x=>x.onclick=()=>location.hash='axis-'+x.dataset.axis)}window.addEventListener('hashchange',render);load();
</script></body></html>
