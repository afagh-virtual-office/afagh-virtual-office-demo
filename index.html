<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFAGH Virtual Office — Architecture Control Tower</title>
<style>
:root{--bg:#07101c;--panel:#0d1929;--panel2:#11243d;--line:#1c3857;--text:#ecf5ff;--muted:#8fa8c2;--accent:#66d9ef;--good:#5ee6a8;--warn:#ffd166;--bad:#ff6b7a;--shadow:0 12px 32px rgba(0,0,0,.18)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#122847 0,#07101c 48%);color:var(--text);font-family:Inter,Segoe UI,Tahoma,sans-serif}button{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-left:1px solid var(--line);background:#06111f;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{padding:8px 10px 24px;border-bottom:1px solid var(--line);margin-bottom:14px}.brand b{display:block;font-size:15px;letter-spacing:.08em}.brand span{font-size:10px;color:var(--muted)}nav button{display:block;width:100%;border:0;background:transparent;color:var(--muted);text-align:right;padding:11px 12px;border-radius:9px;cursor:pointer;margin:3px 0}nav button:hover,nav button.active{background:var(--panel2);color:var(--text)}main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.12em}.top h1{margin:7px 0 6px;font-size:30px}.top p{margin:0;color:var(--muted);max-width:880px;line-height:1.7}.status{border:1px solid #6d3140;background:#29151e;color:#ff9cab;padding:10px 13px;border-radius:10px;font-size:11px;font-weight:800;text-align:right;line-height:1.7;min-width:170px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(13,25,41,.92);border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow)}.metric{font-size:27px;font-weight:850;margin:8px 0}.label{color:var(--muted);font-size:11px;line-height:1.7}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.section{margin-top:18px}.section h2{font-size:15px;margin:0 0 11px}.wide{grid-column:span 2}.tower{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.axis{padding:15px;background:#0a1627;border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:.18s}.axis:hover{border-color:#3c688f;transform:translateY(-1px)}.axis-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.axis h3{margin:0;font-size:14px}.axis .code{font-size:10px;color:var(--accent);font-weight:800}.axis p{margin:9px 0;color:var(--muted);font-size:11px;line-height:1.7}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;border:1px solid #5a2531;background:#25141c;color:#ff9cab}.badge.pass{border-color:#1d694d;background:#0f2d25;color:#8bf4c5}.badge.unknown{border-color:#5b4b23;background:#251f10;color:#ffe08a}.axis-foot{display:flex;justify-content:space-between;gap:10px;color:#a6bbd0;font-size:10px}.detail{display:none}.detail.active{display:block}.detail-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.back{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 11px;border-radius:8px;cursor:pointer}.detail h2{margin:5px 0 7px;font-size:25px}.detail-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.domain{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#0a1627;margin:6px 0;font-size:11px}.blocker{border-right:3px solid var(--bad);background:#160f18;padding:12px;margin:8px 0;border-radius:7px}.blocker b{display:block;margin-bottom:4px;font-size:12px}.blocker small{color:var(--muted);line-height:1.7}.team{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0;font-size:11px}.snapshot{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:5px 8px;background:#0a1627;border:1px solid var(--line);border-radius:7px;color:#a6bbd0;font-size:10px}.footer{margin-top:22px;color:#71869f;font-size:10px;line-height:1.7}.mobile{display:none}@media(max-width:980px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;border-left:0;border-bottom:1px solid var(--line)}nav{display:grid;grid-template-columns:repeat(2,1fr)}main{padding:18px}.grid,.tower,.detail-grid{grid-template-columns:1fr}.wide{grid-column:span 1}.top,.detail-top{flex-direction:column}.mobile{display:block}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><b>AFAGH VIRTUAL OFFICE</b><span>ARCHITECTURE CONTROL TOWER</span></div>
  <nav id="nav"></nav>
  <div class="footer">PUBLIC DEMO / SANDBOX<br>Evidence is controlled and non-live.</div>
</aside>
<main id="app"></main>
</div>
<script>
const routes={dashboard:'داشبورد مرکزی',architecture:'معماری',organizations:'سازمان‌ها',business:'Business 360',ai:'AI Workforce',workflow:'Workflow',trust:'Trust & Security',evidence:'Evidence Center',governance:'Governance'};
let evidence=null,axes=null;
const statusClass=s=>s==='PASS'?'pass':s==='UNKNOWN'?'unknown':'';
const load=async()=>{try{const [e,a]=await Promise.all([fetch('data/evidence.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/architecture-axes.json',{cache:'no-store'}).then(r=>r.json())]);evidence=e;axes=a.axes}catch(err){evidence={gate:'UNKNOWN',production:'UNKNOWN',architecture_contracts:{pass:0,total:0},runtime_evidence:{pass:0,total:0},verifier:{pass:0,total:0,blockers:0},axes:{},blockers:[{id:'DATA-001',title:'Architecture snapshot unavailable',reason:'Controlled data could not be loaded.'}],pipeline:{upstream_connection:'UNKNOWN'}};axes=[]}render()};
function nav(r){document.getElementById('nav').innerHTML=Object.entries(routes).map(([k,v])=>`<button class="${r===k?'active':''}" data-r="${k}">${v}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>location.hash=b.dataset.r)}
function stat(label,value,cls=''){return `<div class="card"><div class="label">${label}</div><div class="metric ${cls}">${value}</div></div>`}
function axisCard(a){return `<div class="axis" data-axis="${a.id}"><div class="axis-head"><div><div class="code">${a.id}</div><h3>${a.fa} / ${a.name}</h3></div><span class="badge ${statusClass(a.status)}">${a.status}</span></div><p>${a.purpose}</p><div class="axis-foot"><span>${a.domains.length} domain</span><span>${a.gate}</span></div></div>`}
function dashboard(){const e=evidence||{};return `<div id="dashboard"><div class="top"><div><div class="eyebrow">CONTROL PLANE / EVIDENCE-DRIVEN</div><h1>مرکز کنترل معماری دفتر مجازی</h1><p>۱۰ محور معماری اکنون به‌عنوان واحدهای قابل ارزیابی نمایش داده می‌شوند. هر محور باید از Intent تا Contract، Implementation، Verification، Evidence و Gate قابل ردیابی باشد.</p></div><div class="status">GATE — ${e.gate||'UNKNOWN'}<br>PRODUCTION — ${e.production||'UNKNOWN'}</div></div><div class="grid">${stat('Architecture Contracts',`${e.architecture_contracts?.pass??0}/${e.architecture_contracts?.total??0}`,'good')}${stat('Runtime Evidence',`${e.runtime_evidence?.pass??0}/${e.runtime_evidence?.total??0}`,'good')}${stat('Verifier',`${e.verifier?.pass??0}/${e.verifier?.total??0}`,'warn')}${stat('Active Blockers',e.verifier?.blockers??0,'bad')}</div><div class="section grid"><div class="card wide"><h2>۱۰ محور معماری — Architecture Control Tower</h2><div class="tower">${(axes||[]).map(axisCard).join('')}</div></div><div class="card wide"><h2>چهار تیم</h2>${['Team 1 — Architecture & Technology','Team 2 — Domain / Business / Trade','Team 3 — Security / Quality / Governance','Team 4 — AI & Intelligence Architecture'].map((x,i)=>`<div class="team"><span>${x}</span><b class="${i===2||i===3?'bad':'warn'}">${i===2||i===3?'CONDITIONAL':'CONDITIONAL'}</b></div>`).join('')}</div></div><div class="section card"><h2>Active Blockers</h2>${(e.blockers||[]).map(b=>`<div class="blocker"><b>${b.id} — ${b.title}</b><small>${b.reason}</small></div>`).join('')}</div><div class="footer">Reviewed HEAD: ${e.reviewed_head||'unknown'} · Run #${e.reviewed_run||'unknown'} · Snapshot: controlled / not live · Upstream: ${e.pipeline?.upstream_connection||'unknown'}</div></div>`}
function detailPage(id){const a=(axes||[]).find(x=>x.id===id);if(!a)return dashboard();return `<div class="detail active"><div class="detail-top"><div><div class="eyebrow">ARCHITECTURE AXIS / ${a.id}</div><h2>${a.fa}</h2><p class="label">${a.purpose}</p></div><button class="back" onclick="location.hash='dashboard'">بازگشت به Control Tower</button></div><div class="detail-grid"><div><div class="card"><h3>Scope</h3>${a.domains.map(d=>`<div class="domain">${d}</div>`).join('')}</div><div class="card section"><h3>Gate Criterion</h3><p class="label">${a.gate}</p><div class="snapshot"><span class="tag">Status: ${a.status}</span><span class="tag">Level: architecture control</span><span class="tag">Evidence-driven</span></div></div></div><div><div class="card"><h3>Current Evidence</h3><p class="label">The dashboard does not infer PASS from presentation. Current controlled snapshot reports Gate <b>${evidence?.gate||'UNKNOWN'}</b> and Production <b>${evidence?.production||'UNKNOWN'}</b>.</p></div><div class="card section"><h3>Next Control</h3><p class="label">Connect this axis to a concrete architecture contract, implementation surface, automated verifier, evidence record and four-team gate decision.</p></div></div></div></div>`}
function modulePage(key){const titles={architecture:'Architecture Control',organizations:'Organizations',business:'Business 360',ai:'AI Workforce',workflow:'Workflow Orchestration',trust:'Trust & Security',evidence:'Evidence Center',governance:'Governance & ADR'};return `<div class="detail active"><div class="eyebrow">MODULE</div><h2>${titles[key]}</h2><div class="card"><b>STATUS: DESIGN_REVIEW</b><p class="label">این ماژول در Shell محصول تعریف شده است. داده عملیاتی تنها از منبع معتبر و evidence کنترل‌شده قابل نمایش است.</p></div></div>`}
function render(){const r=location.hash.slice(1)||'dashboard';nav(r);if(r==='dashboard')document.getElementById('app').innerHTML=dashboard();else if(r.startsWith('axis-'))document.getElementById('app').innerHTML=detailPage(r.replace('axis-',''));else document.getElementById('app').innerHTML=modulePage(r in routes?r:'dashboard');document.querySelectorAll('.axis').forEach(x=>x.onclick=()=>location.hash='axis-'+x.dataset.axis)}
window.addEventListener('hashchange',render);load();
</script>
</body>
</html>
