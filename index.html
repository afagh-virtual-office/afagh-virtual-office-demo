<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFAGH VIRTUAL OFFICE — مرکز کنترل تماسهای مجازی AFAGH</title>
<meta name="theme-color" content="#050a12">
<style>
:root{--bg:#050a12;--panel:#0a1220;--panel2:#0e1929;--panel3:#111f32;--line:#1d3149;--line2:#2a4664;--text:#f4f8fc;--muted:#8ca2b8;--dim:#62778d;--cyan:#67e8f9;--violet:#9b8cff;--green:#62e6a5;--amber:#ffd166;--red:#ff7184;--shadow:0 24px 70px rgba(0,0,0,.34);--r:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(900px 520px at 82% -8%,rgba(103,232,249,.10),transparent 62%),radial-gradient(800px 560px at 8% 105%,rgba(155,140,255,.08),transparent 60%),var(--bg);color:var(--text);font-family:Inter,Segoe UI,Tahoma,Arial,sans-serif}button{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:286px minmax(0,1fr)}.side{position:sticky;top:0;height:100vh;padding:18px 15px;background:rgba(4,10,18,.82);backdrop-filter:blur(20px);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:5}.brand{padding:10px 10px 20px;margin-bottom:15px;border-bottom:1px solid var(--line)}.brand-mark{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 8px 30px rgba(103,232,249,.20);position:relative}.logo:after{content:"";position:absolute;inset:8px;border:2px solid rgba(255,255,255,.75);border-radius:7px}.brand b{font-size:13px;letter-spacing:.14em;white-space:nowrap}.brand span{display:block;margin-top:9px;color:var(--muted);font-size:9px;line-height:1.9}nav{display:grid;gap:4px}nav button{position:relative;width:100%;border:1px solid transparent;background:transparent;color:var(--muted);text-align:right;padding:10px 12px;border-radius:11px;cursor:pointer;transition:.2s}nav button:hover{background:rgba(255,255,255,.035);color:var(--text);border-color:var(--line)}nav button.active{background:linear-gradient(90deg,rgba(103,232,249,.10),rgba(155,140,255,.09));border-color:#29435e;color:var(--text);box-shadow:inset 0 0 24px rgba(103,232,249,.025)}nav button.active:before{content:"";position:absolute;right:-1px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--cyan)}.nav-kicker{font-size:8px;color:var(--dim);letter-spacing:.14em;margin:15px 10px 5px}.side-foot{margin-top:auto;padding:13px 10px 3px;color:#62778d;font-size:8px;line-height:1.9;letter-spacing:.05em}.online{display:flex;align-items:center;gap:7px;margin-bottom:7px;color:#8ea8ba}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 13px rgba(98,230,165,.65)}main{width:100%;max-width:1660px;margin:auto;padding:26px 34px 46px}.command{display:flex;align-items:center;gap:10px;margin-bottom:20px}.command-search{flex:1;min-width:160px;height:40px;border:1px solid var(--line);background:rgba(10,18,32,.72);border-radius:12px;color:var(--muted);display:flex;align-items:center;padding:0 13px;font-size:10px}.command-search span{margin-left:auto}.command-chip{height:40px;padding:0 12px;border:1px solid var(--line);background:rgba(10,18,32,.72);border-radius:12px;color:var(--muted);display:flex;align-items:center;gap:7px;font-size:9px}.command-chip strong{color:var(--text);font-size:9px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:22px}.eyebrow{font-size:9px;font-weight:850;letter-spacing:.17em;color:var(--cyan)}h1{font-size:34px;line-height:1.22;margin:8px 0 8px;letter-spacing:-.035em}.lead{margin:0;color:var(--muted);max-width:900px;line-height:1.9;font-size:11px}.release-pill{min-width:255px;padding:15px 17px;border:1px solid rgba(255,113,132,.35);background:radial-gradient(300px 130px at 20% 50%,rgba(255,113,132,.10),transparent 70%),rgba(10,17,28,.82);border-radius:16px;box-shadow:var(--shadow)}.release-pill small{display:block;color:var(--muted);font-size:8px;letter-spacing:.13em;margin-bottom:5px}.release-pill strong{display:block;font-size:16px;color:var(--red);letter-spacing:.05em}.release-pill div{margin-top:5px;font-size:8px;color:#b9c7d4}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(15,29,47,.96),rgba(8,16,28,.96));border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}.metric:before{content:"";position:absolute;right:0;top:0;width:70px;height:2px;background:linear-gradient(90deg,transparent,var(--cyan))}.metric:after{content:"";position:absolute;width:120px;height:120px;left:-48px;bottom:-65px;border-radius:50%;background:rgba(103,232,249,.045)}.metric-label{color:var(--muted);font-size:9px}.metric-value{font-size:27px;font-weight:900;margin:8px 0 3px}.metric-note{font-size:8px;color:var(--dim)}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.section{margin-top:17px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:10px}.section-title{margin:0;font-size:14px}.section-sub{color:var(--dim);font-size:8px;letter-spacing:.08em}.card{background:linear-gradient(145deg,rgba(13,25,42,.94),rgba(7,15,26,.95));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:19px}.release-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:12px}.gate-hero{min-height:168px;display:flex;flex-direction:column;justify-content:center;padding:24px;border-radius:16px;border:1px solid rgba(255,113,132,.30);background:radial-gradient(650px 230px at 86% 45%,rgba(255,113,132,.11),transparent 65%),linear-gradient(145deg,#0d1725,#090f1b)}.gate-kicker{font-size:8px;color:var(--muted);letter-spacing:.14em}.gate-value{font-size:31px;font-weight:950;color:var(--red);margin:5px 0}.gate-copy{max-width:760px;color:#b8c6d4;font-size:10px;line-height:1.9;margin:0}.gate-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.mini-tag{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#091523;color:#8ea5ba;font-size:8px}.rules{display:grid;gap:7px}.rule{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border:1px solid var(--line);background:rgba(8,18,31,.82);border-radius:10px;font-size:9px}.rule b{font-size:8px}.tower-wrap{position:relative;padding:2px}.tower-line{position:absolute;right:50%;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,var(--line2),transparent);opacity:.45}.tower-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.axis{position:relative;cursor:pointer;min-height:142px;padding:16px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#0a1727,#07111e);transition:.22s;overflow:hidden}.axis:after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,rgba(103,232,249,.18),transparent)}.axis:hover,.team:hover{transform:translateY(-2px);border-color:#385b7d;box-shadow:0 18px 40px rgba(0,0,0,.25)}.axis-head,.team-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.code{font-size:8px;color:var(--cyan);font-weight:900;letter-spacing:.12em}.axis h3{font-size:11px;margin:4px 0 0}.axis p{font-size:9px;color:var(--muted);line-height:1.8;margin:10px 0}.axis-foot{display:flex;justify-content:space-between;gap:10px;color:#7f96ac;font-size:8px}.badge{display:inline-flex;align-items:center;justify-content:center;padding:5px 8px;border-radius:999px;font-size:7px;font-weight:900;border:1px solid #394b60;background:#101b29;color:#b9cadb;white-space:nowrap}.badge.pass{color:#8df2c2;border-color:#24694e;background:#0d2b23}.badge.blocked{color:#ff9aaa;border-color:#6c3040;background:#2a151e}.badge.partial,.badge.in_progress,.badge.waiting_evidence,.badge.conditional,.badge.unknown{color:#ffe08b;border-color:#5c4b24;background:#282010}.teams{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.team{padding:14px;border:1px solid var(--line);border-radius:13px;background:#091625;transition:.2s}.team h3{margin:0;font-size:10px}.team .fa{margin-top:4px;color:var(--muted);font-size:8px}.team-meta{margin-top:9px;color:#8fa5ba;font-size:8px;line-height:1.9}.team-gates{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.gate-tag{padding:4px 7px;border-radius:7px;background:#0f1c2c;border:1px solid var(--line);color:#a9bdd0;font-size:7px}.blockers{display:grid;gap:8px}.blocker{position:relative;padding:14px 15px;border-radius:12px;border-right:3px solid var(--red);background:linear-gradient(90deg,rgba(255,113,132,.07),rgba(255,113,132,.012));border-top:1px solid #2d2730;border-bottom:1px solid #2d2730}.blocker b{font-size:9px}.blocker small{display:block;color:var(--muted);font-size:8px;line-height:1.8;margin-top:4px}.footer{margin-top:17px;color:#657b90;font-size:8px;line-height:1.9}.detail{display:none}.detail.active{display:block}.detail-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.back{border:1px solid var(--line);background:#0b1725;color:var(--muted);padding:9px 12px;border-radius:10px;cursor:pointer}.back:hover{color:var(--text);border-color:#3a5975}.detail h2{font-size:25px;margin:7px 0}.detail-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:15px}.phasebox{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.phase{padding:11px;border:1px solid var(--line);background:#091624;border-radius:10px;text-align:center}.phase small{display:block;color:var(--muted);font-size:7px;margin-bottom:6px}.domain{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#091624;margin:7px 0;font-size:9px}.snapshot{display:flex;flex-wrap:wrap;gap:6px}.tag{padding:6px 8px;background:#091624;border:1px solid var(--line);border-radius:8px;color:#9eb3c7;font-size:8px}.module-note{padding:13px;border:1px dashed var(--line2);border-radius:12px;background:rgba(103,232,249,.025);font-size:9px;color:var(--muted);line-height:1.9}@media(max-width:1100px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;border-left:0;border-bottom:1px solid var(--line);padding:13px 15px}.side-foot{display:none}nav{grid-template-columns:repeat(3,1fr)}.brand{padding-bottom:14px}.command{margin-top:2px}main{padding:22px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){nav{grid-template-columns:repeat(2,1fr)}.command{flex-wrap:wrap}.command-search{flex-basis:100%}.hero,.detail-top{flex-direction:column;align-items:stretch}.release-pill{width:100%}.metrics,.tower-grid,.teams,.release-grid,.detail-grid{grid-template-columns:1fr}.tower-line{display:none}.phasebox{grid-template-columns:repeat(2,1fr)}main{padding:17px}h1{font-size:25px}.gate-value{font-size:27px}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand"><div class="brand-mark"><div class="logo"></div><b>AFAGH VIRTUAL OFFICE</b></div><span>مرکز کنترل تماسهای مجازی AFAGH<br>Evidence-driven control plane</span></div><div class="nav-kicker">OPERATING SYSTEM</div><nav id="nav"></nav><div class="side-foot"><div class="online"><i class="dot"></i> CONTROL PLANE READY</div>EVIDENCE-FIRST ARCHITECTURE<br>Unverified data is never presented as proof.</div></aside><main id="app"></main></div>
<script>
const routes={dashboard:'Overview',architecture:'Architecture',organizations:'Organizations',business:'Business 360',ai:'AI Workforce',workflow:'Workflow',trust:'Trust & Security',evidence:'Evidence Center',governance:'Governance'};let evidence={},axes=[],matrix=[],teams=[];
const statusClass=s=>({PASS:'pass',PARTIAL:'partial',IN_PROGRESS:'in_progress',WAITING_EVIDENCE:'waiting_evidence',BLOCKED:'blocked',CONDITIONAL:'conditional',UNKNOWN:'unknown'}[s]||'unknown');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error(path);return r.json()}
async function load(){try{const [e,a,m,t]=await Promise.all([json('data/evidence.json'),json('data/architecture-axes.json'),json('data/phase-completion-board.json'),json('data/governance-control.json')]);evidence=e;axes=a.axes||[];matrix=m.axes||[];teams=t.teams||[]}catch(err){evidence={gate:'BLOCKED',production:'BLOCKED',architecture_contracts:{pass:0,total:0},runtime_evidence:{pass:0,total:0},verifier:{pass:0,total:0,blockers:1},blockers:[{id:'DATA-001',title:'Control data unavailable',reason:'Controlled data sources could not be loaded.'}]};axes=[];matrix=[];teams=[]}render()}
function nav(route){document.getElementById('nav').innerHTML=Object.entries(routes).map(([k,v])=>`<button class="${route===k?'active':''}" data-r="${k}">${v}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>location.hash=b.dataset.r)}
function metric(label,value,note,cls){return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value ${cls||''}">${esc(value)}</div><div class="metric-note">${note}</div></div>`}
function overall(m,a){const p=Object.values(m?.phases||{});return p.some(x=>x.status==='BLOCKED')?'BLOCKED':p.some(x=>x.status==='IN_PROGRESS')?'IN_PROGRESS':m?.status||a?.status||'UNKNOWN'}
function axisCard(a){const m=matrix.find(x=>x.id===a.id),s=overall(m,a);return `<div class="axis" data-axis="${esc(a.id)}"><div class="axis-head"><div><div class="code">${esc(a.id)}</div><h3>${esc(a.fa)} / ${esc(a.name)}</h3></div><span class="badge ${statusClass(s)}">${esc(s)}</span></div><p>${esc(a.purpose)}</p><div class="axis-foot"><span>Phase coverage ${Object.keys(m?.phases||{}).length}/4</span><span>${esc(a.gate||'CONTROL')}</span></div></div>`}
function teamCard(t){return `<div class="team"><div class="team-head"><div><h3>${esc(t.name)}</h3><div class="fa">${esc(t.fa)}</div></div><span class="badge ${statusClass(t.status)}">${esc(t.status)}</span></div><div class="team-meta"><b>Decision Authority:</b> ${esc(t.decision_authority)}<br><b>Next:</b> ${esc(t.next_action)}</div><div class="team-gates">${(t.open_gates||[]).map(g=>`<span class="gate-tag">${esc(g)}</span>`).join('')}</div></div>`}
function dashboard(){const e=evidence||{};return `<section id="dashboard"><div class="command"><div class="command-search">Global command search <span>⌘ K</span></div><div class="command-chip">CONTEXT <strong>AFAGH</strong></div><div class="command-chip">EVIDENCE <strong>CONTROLLED</strong></div><div class="command-chip">GATE <strong class="bad">${esc(e.gate||'UNKNOWN')}</strong></div></div><div class="hero"><div><div class="eyebrow">ENTERPRISE OPERATING SYSTEM / CONTROL PLANE</div><h1>مرکز کنترل تماسهای مجازی AFAGH</h1><p class="lead">Command Center یکپارچه برای Architecture، Evidence، Verification، Governance و Release Control — با تفکیک صریح بین وضعیت بصری محصول و وضعیت واقعی معماری.</p></div><div class="release-pill"><small>RELEASE GATE / SOURCE-DERIVED</small><strong>${esc(e.gate||'UNKNOWN')}</strong><div>PRODUCTION — ${esc(e.production||'UNKNOWN')}</div></div></div><div class="metrics">${metric('Architecture Contracts',`${e.architecture_contracts?.pass??0}/${e.architecture_contracts?.total??0}`,'contract coverage','good')}${metric('Runtime Evidence',`${e.runtime_evidence?.pass??0}/${e.runtime_evidence?.total??0}`,'runtime verification','good')}${metric('Verifier',`${e.verifier?.pass??0}/${e.verifier?.total??0}`,'machine-checked','warn')}${metric('Active Blockers',e.verifier?.blockers??0,'release-impacting','bad')}</div><div class="section release-grid"><div class="gate-hero"><div class="gate-kicker">RELEASE DECISION / EVIDENCE-FIRST</div><div class="gate-value">${esc(e.gate||'UNKNOWN')}</div><p class="gate-copy">تا زمانی که Gateهای اجباری و Evidence واقعی تأیید نشوند، P0-1 PASS صادر نمی‌شود. این UI فقط وضعیت لایه Evidence را نمایش می‌دهد و هیچ Gate معماری را مستقل از منبع حقیقت تغییر نمی‌دهد.</p><div class="gate-meta"><span class="mini-tag">Visual state ≠ Architecture state</span><span class="mini-tag">FAIL-CLOSED</span><span class="mini-tag">LIVE: ${String(e.live??false)}</span></div></div><div class="card"><div class="section-head"><h2 class="section-title">Control Rules</h2><span class="section-sub">NON-NEGOTIABLE</span></div><div class="rules"><div class="rule"><span>Evidence</span><b class="good">REQUIRED</b></div><div class="rule"><span>Unverified proof</span><b class="bad">REJECTED</b></div><div class="rule"><span>P0-1 PASS</span><b class="bad">PROHIBITED</b></div><div class="rule"><span>Snapshot</span><b>${esc(e.snapshot_type||'CONTROLLED')}</b></div></div></div></div><div class="section"><div class="section-head"><h2 class="section-title">۱۰ محور معماری — Control Tower</h2><span class="section-sub">SELECT AN AXIS / DETAIL VIEW</span></div><div class="tower-wrap"><div class="tower-line"></div><div class="tower-grid">${axes.map(axisCard).join('')}</div></div></div><div class="section card"><div class="section-head"><h2 class="section-title">Governance Control</h2><span class="section-sub">DECISION AUTHORITIES</span></div><div class="teams">${teams.map(teamCard).join('')}</div></div><div class="section card"><div class="section-head"><h2 class="section-title">Evidence / Blockers</h2><span class="section-sub">NO MANUAL PASS</span></div><div class="blockers">${(e.blockers||[]).map(b=>`<div class="blocker"><b>${esc(b.id)} — ${esc(b.title)}</b><small>${esc(b.reason)}</small></div>`).join('')||'<div class="section-sub">No blocker recorded.</div>'}</div></div><div class="footer">Reviewed HEAD: ${esc(e.reviewed_head||'unknown')} · Snapshot: controlled / not live · Upstream: ${esc(e.pipeline?.upstream_connection||'unknown')}<br>EVIDENCE-DRIVEN CONTROL PLANE · Unverified data is never presented as proof.</div></section>`}
function detail(id){const a=axes.find(x=>x.id===id),m=matrix.find(x=>x.id===id);if(!a)return dashboard();const phases=m?.phases||{};return `<section class="detail active"><div class="command"><div class="command-search">Architecture detail <span>${esc(a.id)}</span></div><div class="command-chip">SOURCE <strong>CONTROLLED</strong></div></div><div class="detail-top"><div><div class="eyebrow">ARCHITECTURE AXIS / ${esc(a.id)}</div><h2>${esc(a.fa)} / ${esc(a.name)}</h2><p class="lead">${esc(a.purpose)}</p></div><button class="back" onclick="location.hash='dashboard'">بازگشت به Control Tower</button></div><div class="detail-grid"><div class="card"><div class="section-head"><h2 class="section-title">Phase State</h2><span class="section-sub">MACHINE-READABLE</span></div><div class="phasebox">${['Phase 1','Phase 2/2.5','Phase 3','Phase 4'].map(p=>{const x=phases[p]||{status:'UNKNOWN'};return `<div class="phase"><small>${p}</small><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span></div>`}).join('')}</div><div class="section"><div class="domain"><b>Gate:</b> ${esc(a.gate||'UNKNOWN')}</div><div class="domain"><b>Overall:</b> ${esc(overall(m,a))}</div></div></div><div class="card"><div class="section-head"><h2 class="section-title">Evidence Surface</h2><span class="section-sub">NO CLAIM WITHOUT EVIDENCE</span></div><div class="snapshot"><span class="tag">${esc(evidence.snapshot_type||'controlled')}</span><span class="tag">live: ${String(evidence.live??false)}</span><span class="tag">gate: ${esc(evidence.gate||'UNKNOWN')}</span></div><div class="section"><div class="module-note">Status is derived from the controlled evidence model, not independently asserted by the UI. Opening this detail page changes presentation only.</div></div></div></div></section>`}
function simple(route){const names={architecture:'معماری',organizations:'سازمان‌ها',business:'Business 360',ai:'AI Workforce',workflow:'Workflow',trust:'Trust & Security',evidence:'Evidence Center',governance:'Governance'};return `<section class="detail active"><div class="detail-top"><div><div class="eyebrow">AFAGH VIRTUAL OFFICE / MODULE</div><h2>${names[route]||route}</h2><p class="lead">این سطح در Shell مرکزی تعریف شده و به لایه‌های Evidence و Governance متصل می‌شود.</p></div><button class="back" onclick="location.hash='dashboard'">بازگشت به Dashboard</button></div><div class="section card"><div class="section-head"><h2 class="section-title">Module Boundary</h2><span class="badge conditional">CONTROLLED</span></div><div class="module-note">تا زمانی که منبع Evidence واقعی متصل نشده باشد، این ماژول وضعیت عملیاتی را به‌عنوان LIVE نمایش نمی‌دهد. Presentation layer نمی‌تواند Gate یا Source of Truth را تغییر دهد.</div></div></section>`}
function render(){const r=location.hash.slice(1)||'dashboard';nav(r);document.getElementById('app').innerHTML=r==='dashboard'?dashboard():axes.some(a=>a.id===r)?detail(r):simple(r);document.querySelectorAll('[data-axis]').forEach(x=>x.onclick=()=>location.hash=x.dataset.axis)}
window.addEventListener('hashchange',render);load();
</script></body></html>
