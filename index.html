const tr=k=>t[k]||k; const statusClass=s=>s==='BLOCKED'?'blocked':s==='PASS'?'pass':'pending';
async function json(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p);return r.json()}
async function load(){try{const [a,b,c,d]=await Promise.all([json('data/evidence.json'),json('data/architecture-axes.json'),json('data/phase-completion-board.json'),json('data/governance-control.json')]);evidence=a;axes=b.axes||[];matrix=c.axes||[];teams=d.teams||[]}catch(x){evidence={gate:'BLOCKED',production:'BLOCKED',architecture_contracts:{pass:0,total:0},runtime_evidence:{pass:0,total:0},verifier:{pass:0,total:0,blockers:1},blockers:[{id:'DATA-001',title:'Control data unavailable',reason:'Controlled data sources could not be loaded.'}]}}render()}
function setLanguage(n){lang=n;t=I18N[lang];localStorage.setItem('afagh-lang',lang);document.documentElement.lang=lang;document.documentElement.dir=t.dir;render()}
function nav(r){document.getElementById('nav').innerHTML=routes.map(k=>`<button class="${r===k?'active':''}" data-r="${k}">${tr(k==='evidence'?'evidenceCenter':k)}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>location.hash=b.dataset.r)}
function shell(){document.getElementById('brandSub').innerHTML=tr('brandSub');document.getElementById('navLabel').textContent=tr('navLabel');document.getElementById('ready').textContent=tr('ready');document.getElementById('foot').innerHTML=tr('foot')}
function command(){return `<div class="command"><div class="search"><span>${tr('search')}</span><b>⌕</b></div><div class="chip">${tr('context')} <strong>AFAGH</strong></div><div class="chip">${tr('evidence')} <strong>${evidence.live?'LIVE':'CONTROLLED'}</strong></div><div class="chip">${tr('gate')} <strong>${esc(evidence.gate||'UNKNOWN')}</strong></div><button class="lang" onclick="setLanguage(lang==='fa'?'en':'fa')">${lang==='fa'?'EN':'فا'}</button></div>`}
function core(){return `<div class="core"><div class="core-orbit"><div class="core-center"><div><strong>${tr('core')}</strong><small>DECIDE · ORCHESTRATE · EXECUTE</small></div></div><span class="node n1">CONTEXT</span><span class="node n2">INTELLIGENCE</span><span class="node n3">REASONING</span><span class="node n4">DECISION</span><span class="node n5">WORKFORCE</span><span class="node n6">EVIDENCE</span></div></div>`}
function hero(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">${tr('heroEyebrow')}</div><h1>${tr('heroTitle')}</h1><h2>${tr('heroSub')}</h2><p>${tr('heroLead')}</p><p class="master">${tr('master')}</p><div class="hero-actions"><button class="primary" onclick="location.hash='dashboard-command'">${tr('enter')}</button><button class="secondary" onclick="document.getElementById('ai-workforce').scrollIntoView({behavior:'smooth'})">${tr('discover')}</button></div><div class="hero-tags"><span class="tag">AI INTELLIGENCE</span><span class="tag">AI WORKFORCE</span><span class="tag">INTELLIGENT OPERATIONS</span><span class="tag">TRUST & GOVERNANCE</span></div></div>${core()}<div class="flow"><i>${tr('loop')}</i></div></section>`}
function pillars(){return `<section class="section"><div class="pillars"><div class="pillar"><div class="icon">🧠</div><h3>${tr('intelligence')}</h3><p>${tr('intelligenceP')}</p><div class="micro">${tr('understand')}</div></div><div class="pillar"><div class="icon">🤖</div><h3>${tr('workforce')}</h3><p>${tr('workforceP')}</p><div class="micro">${tr('agents')}</div></div><div class="pillar"><div class="icon">⚙</div><h3>${tr('operations')}</h3><p>${tr('operationsP')}</p><div class="micro">${tr('workflowMicro')}</div></div></div></section>`}
function commandCenter(){let live=evidence.live===true;return `<section class="section" id="dashboard-command"><div class="sectionhead"><h2>${tr('command')}</h2><span>${tr('liveData')} · ${live?'LIVE':'CONTROLLED / NOT LIVE'}</span></div><div class="commandgrid"><div class="panel"><div class="statgrid"><div class="stat"><small>${tr('agentsMetric')}</small><b>${live?'—':'—'}</b><span>${tr('attention')}</span></div><div class="stat"><small>${tr('missions')}</small><b>${live?'—':'—'}</b><span>${tr('completed')}</span></div><div class="stat"><small>${tr('decisions')}</small><b>${live?'—':'—'}</b><span>${tr('pending')}</span></div></div><div class="stream"><div class="event"><time>—</time><small>${tr('missionStarted')}</small><b>${tr('controlled')}</b></div><div class="event"><time>—</time><small>${tr('contextUpdated')}</small><b>${tr('controlled')}</b></div><div class="event"><time>—</time><small>${tr('recommendation')}</small><b>${tr('controlled')}</b></div><div class="event"><time>—</time><small>${tr('executionStarted')}</small><b>${tr('controlled')}</b></div><div class="event"><time>—</time><small>${tr('eventRecorded')}</small><b>${tr('controlled')}</b></div></div></div><div class="gate"><small>${tr('release')}</small><strong>${esc(evidence.gate||'UNKNOWN')}</strong><p>${lang==='fa'?'تا زمانی که Gateهای اجباری و Evidence واقعی تأیید نشوند، PASS صادر نمی‌شود. این صفحه وضعیت Evidence را نمایش می‌دهد.':'No PASS is issued until mandatory gates and real Evidence are verified. This page presents evidence state.'}</p></div></div></section>`}
function workforce(){return `<section class="section" id="ai-workforce"><div class="sectionhead"><h2>${tr('workforceTitle')}</h2><span>${tr('workforceSub')}</span></div><div class="workforce"><div class="panel"><div class="agentflow"><div class="flowbox"><strong>${tr('human')}</strong><small>CONTROL</small></div><span class="arrow">→</span><div class="flowbox"><strong>${tr('agent')}</strong><small>ROLE · POLICY</small></div><span class="arrow">→</span><div class="flowbox"><strong>${tr('mission')}</strong><small>OBJECTIVE</small></div><span class="arrow">→</span><div class="flowbox"><strong>Workflow</strong><small>ORCHESTRATE</small></div><span class="arrow">→</span><div class="flowbox"><strong>${tr('exec')}</strong><small>TOOLS</small></div><span class="arrow">→</span><div class="flowbox"><strong>${tr('evidenceTitle')}</strong><small>VERIFY</small></div></div></div><div class="panel"><div class="agentlist"><div class="agent"><div><strong>Strategy Agent</strong><small>Role · Mission · Permission · Policy · Evidence</small></div><span class="dotg"></span></div><div class="agent"><div><strong>Operations Agent</strong><small>Role · Mission · Permission · Policy · Evidence</small></div><span class="dotg"></span></div><div class="agent"><div><strong>Customer Intelligence</strong><small>Role · Mission · Permission · Policy · Evidence</small></div><span class="dotg"></span></div><div class="agent"><div><strong>Risk Agent</strong><small>Role · Mission · Permission · Policy · Evidence</small></div><span class="dotg"></span></div></div></div></div></section>`}
function business360(){return `<section class="section"><div class="sectionhead"><h2>${tr('businessTitle')}</h2><span>${tr('businessSub')}</span></div><div class="panel"><div class="businessflow">${[tr('customer'),tr('businessNode'),tr('demand'),tr('supply'),tr('communication'),tr('workflowNode'),tr('decisionNode'),tr('executionNode'),tr('evidenceNode')].map((x,i)=>`<span class="bf ${i%2===0?'active':''}">${x}</span>${i<8?'<b class="arrow">→</b>':''}`).join('')}</div></div></section>`}
function operations(){return `<section class="section"><div class="sectionhead"><h2>${tr('intopsTitle')}</h2><span>DETECT → VERIFY</span></div><div class="panel"><div class="intops">${[['detect','DETECTION'],['understand','CONTEXT'],['decide','DECISION'],['assign','WORKFORCE'],['execute','ACTION'],['monitor','OBSERVE'],['verify','EVIDENCE']].map(x=>`<div class="op"><b>${tr(x[0])}</b><small>${x[1]}</small></div>`).join('')}</div></div></section>`}
function trust(){return `<section class="section"><div class="sectionhead"><h2>${tr('trustTitle')}</h2><span>${tr('trustSub')}</span></div><div class="trustgrid"><div class="panel"><div class="trustitems">${['identity','authorization','tenant','security','audit','evidenceNode','aiGov'].map(x=>`<div class="trust">${tr(x)}<span>CONTROLLED</span></div>`).join('')}</div></div><div class="gate"><small>${tr('release')}</small><strong>${esc(evidence.gate||'UNKNOWN')}</strong><p>${tr('noClaim')}</p></div></div></section>`}
function tower(){return `<section class="section"><div class="sectionhead"><h2>${tr('architectureTitle')}</h2><span>${tr('architectureSub')}</span></div><div class="tower">${axes.map(a=>`<div class="axis" data-axis="${esc(a.id)}"><code>${esc(a.id)}</code><h3>${esc(lang==='fa'?(a.fa||a.name):a.name)}</h3><p>${esc(a.purpose)}</p><span class="badge ${statusClass(a.status)}">${esc(a.status||'UNKNOWN')}</span></div>`).join('')}</div></section>`}
function evidenceCenter(){let bs=evidence.blockers||[];return `<section class="section"><div class="sectionhead"><h2>${tr('evidenceCenterTitle')}</h2><span>${tr('evidenceCenterSub')}</span></div><div class="evidence"><div class="panel"><div class="evidencechain"><span class="ec">${tr('action')}</span><b>→</b><span class="ec">${tr('decision')}</span><b>→</b><span class="ec">${tr('execution')}</span><b>→</b><span class="ec">${tr('audit')}</span><b>→</b><span class="ec">${tr('evidenceNode')}</span></div><div class="footer">${tr('footer')}</div></div><div class="panel"><div class="blockers">${bs.map(b=>`<div class="blocker"><b>${esc(b.id)} — ${esc(b.title)}</b><small>${esc(b.reason)}</small></div>`).join('')||'<div class="footer">No blocker recorded.</div>'}</div></div></div></section>`}
function footer(){return `<div class="footer">${tr('footer')}<br>Snapshot: ${esc(evidence.snapshot_type||'controlled')} · Live: ${String(evidence.live??false)} · Reviewed HEAD: ${esc(evidence.reviewed_head||'unknown')}</div>`}
function dashboard(){return `${command()}${hero()}${pillars()}${commandCenter()}${workforce()}${business360()}${operations()}${trust()}${tower()}${evidenceCenter()}${footer()}`}
function detail(id){const a=axes.find(x=>x.id===id),m=matrix.find(x=>x.id===id);if(!a)return dashboard();const phases=m?.phases||{};return `${command()}<section class="detail active"><div class="detailtop"><div><div class="eyebrow">ARCHITECTURE AXIS / ${esc(a.id)}</div><h2>${esc(lang==='fa'?(a.fa||a.name):a.name)}</h2><p style="color:var(--muted);font-size:10px;line-height:1.9">${esc(a.purpose)}</p></div><button class="back" onclick="location.hash='dashboard'">${tr('back')}</button></div><div class="detailgrid"><div class="panel"><div class="sectionhead"><h2>${tr('phase')}</h2><span>${tr('machine')}</span></div><div class="phasebox">${['Phase 1','Phase 2/2.5','Phase 3','Phase 4'].map(p=>{const x=phases[p]||{status:'UNKNOWN'};return `<div class="phase"><small>${p}</small><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span></div>`}).join('')}</div><div class="section"><div class="note"><b>${tr('gate')}:</b> ${esc(a.gate||'UNKNOWN')}<br><b>${tr('boundary')}:</b> ${tr('statusDerived')}</div></div></div><div class="panel"><div class="sectionhead"><h2>${tr('evidenceCenterTitle')}</h2><span>${tr('noClaim')}</span></div><div class="note">${tr('controlled')} · live: ${String(evidence.live??false)} · gate: ${esc(evidence.gate||'UNKNOWN')}</div></div></div></section>`}
function simple(r){return `${command()}<section class="detail active"><div class="detailtop"><div><div class="eyebrow">AFAGH VIRTUAL OFFICE / MODULE</div><h2>${tr(r==='evidence'?'evidenceCenter':r)}</h2><p style="color:var(--muted);font-size:10px;line-height:1.9">${tr('statusDerived')}</p></div><button class="back" onclick="location.hash='dashboard'">${tr('back')}</button></div><div class="section panel"><div class="note">${tr('controlled')} · ${tr('noClaim')}</div></div></section>`}
function render(){document.documentElement.lang=lang;document.documentElement.dir=t.dir;shell();let r=location.hash.slice(1)||'dashboard';nav(r);document.getElementById('app').innerHTML=r==='dashboard'?dashboard():axes.some(a=>a.id===r)?detail(r):simple(r);document.querySelectorAll('[data-axis]').forEach(x=>x.onclick=()=>location.hash=x.dataset.axis)}
window.addEventListener('hashchange',render);load();
</script></body></html>
