<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFAGH VIRTUAL OFFICE — مرکز کنترل تماسهای مجازی AFAGH</title>
<meta name="theme-color" content="#07111f">
<style>
:root{--bg:#050b14;--surface:#0b1422;--surface2:#0f1c2d;--line:#20344c;--text:#f3f7fb;--muted:#8fa4ba;--accent:#6ee7f9;--accent2:#9b8cff;--good:#63e6a6;--warn:#ffd166;--bad:#ff7082;--shadow:0 20px 60px rgba(0,0,0,.28);--radius:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,rgba(110,231,249,.12),transparent 60%),radial-gradient(800px 500px at 10% 100%,rgba(155,140,255,.08),transparent 60%),var(--bg);color:var(--text);font-family:Inter,Segoe UI,Tahoma,Arial,sans-serif}button{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:276px 1fr}.side{position:sticky;top:0;height:100vh;padding:22px 16px;background:rgba(5,12,22,.86);backdrop-filter:blur(18px);border-left:1px solid var(--line);display:flex;flex-direction:column}.brand{padding:10px 10px 22px;margin-bottom:16px;border-bottom:1px solid var(--line)}.brand-mark{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 28px rgba(110,231,249,.18)}.brand b{font-size:14px;letter-spacing:.12em}.brand span{display:block;margin-top:7px;color:var(--muted);font-size:10px;line-height:1.7}nav{display:grid;gap:5px}nav button{position:relative;width:100%;border:1px solid transparent;background:transparent;color:var(--muted);text-align:right;padding:11px 13px;border-radius:11px;cursor:pointer;transition:.18s}nav button:hover{background:rgba(255,255,255,.035);color:var(--text);border-color:var(--line)}nav button.active{background:linear-gradient(90deg,rgba(110,231,249,.08),rgba(155,140,255,.09));border-color:#29435e;color:var(--text)}nav button.active:before{content:"";position:absolute;right:-1px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}.side-foot{margin-top:auto;padding:14px 10px 3px;color:#6f8499;font-size:9px;line-height:1.9;letter-spacing:.04em}.online{display:flex;align-items:center;gap:7px;margin-bottom:8px}.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 12px rgba(99,230,166,.6)}main{width:100%;max-width:1600px;margin:auto;padding:28px 34px 44px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--accent)}h1{font-size:31px;line-height:1.25;margin:8px 0 7px;letter-spacing:-.02em}.lead{margin:0;color:var(--muted);max-width:850px;line-height:1.9;font-size:12px}.release-pill{min-width:225px;padding:14px 16px;border:1px solid rgba(255,112,130,.32);background:linear-gradient(135deg,rgba(255,112,130,.10),rgba(255,112,130,.035));border-radius:15px}.release-pill small{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}.release-pill strong{font-size:14px;color:var(--bad);letter-spacing:.04em}.release-pill div{margin-top:5px;font-size:9px;color:#c2ccd7}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.metric{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(15,28,45,.95),rgba(8,18,31,.95));border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.metric:after{content:"";position:absolute;width:100px;height:100px;left:-35px;bottom:-50px;border-radius:50%;background:rgba(110,231,249,.06)}.metric-label{color:var(--muted);font-size:10px}.metric-value{font-size:27px;font-weight:850;margin:8px 0 3px}.metric-note{font-size:9px;color:#71879e}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.section{margin-top:18px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:11px}.section-title{margin:0;font-size:15px}.section-sub{color:var(--muted);font-size:9px}.card{background:linear-gradient(145deg,rgba(13,25,41,.94),rgba(8,17,29,.94));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}.release-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.gate-hero{min-height:155px;display:flex;flex-direction:column;justify-content:center;padding:23px;border-radius:15px;border:1px solid rgba(255,112,130,.28);background:radial-gradient(500px 200px at 90% 50%,rgba(255,112,130,.11),transparent 65%),#0b131f}.gate-kicker{font-size:9px;color:var(--muted);letter-spacing:.12em}.gate-value{font-size:29px;font-weight:900;color:var(--bad);margin:5px 0}.gate-copy{max-width:680px;color:#b8c6d4;font-size:11px;line-height:1.8;margin:0}.rules{display:grid;gap:8px}.rule{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border:1px solid var(--line);background:#091523;border-radius:10px;font-size:10px}.rule b{font-size:9px}.tower-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.axis{cursor:pointer;min-height:145px;padding:16px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#0a1727,#081321);transition:.2s}.axis:hover,.team:hover{transform:translateY(-2px);border-color:#365777;box-shadow:0 16px 35px rgba(0,0,0,.2)}.axis-head,.team-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.code{font-size:9px;color:var(--accent);font-weight:850;letter-spacing:.08em}.axis h3{font-size:12px;margin:4px 0 0}.axis p{font-size:10px;color:var(--muted);line-height:1.8;margin:10px 0}.axis-foot{display:flex;justify-content:space-between;color:#7f96ac;font-size:9px}.badge{display:inline-flex;align-items:center;justify-content:center;padding:5px 8px;border-radius:999px;font-size:8px;font-weight:850;border:1px solid #394b60;background:#101b29;color:#b9cadb;white-space:nowrap}.badge.pass{color:#8df2c2;border-color:#24694e;background:#0d2b23}.badge.blocked{color:#ff9aaa;border-color:#6c3040;background:#2a151e}.badge.partial,.badge.in_progress,.badge.waiting_evidence,.badge.conditional,.badge.unknown{color:#ffe08b;border-color:#5c4b24;background:#282010}.teams{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.team{padding:14px;border:1px solid var(--line);border-radius:13px;background:#091625;transition:.2s}.team h3{margin:0;font-size:11px}.team .fa{margin-top:4px;color:var(--muted);font-size:9px}.team-meta{margin-top:9px;color:#8fa5ba;font-size:9px;line-height:1.9}.team-gates{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.gate-tag{padding:4px 7px;border-radius:7px;background:#0f1c2c;border:1px solid var(--line);color:#a9bdd0;font-size:8px}.blockers{display:grid;gap:8px}.blocker{padding:13px 15px;border-radius:12px;border-right:3px solid var(--bad);background:linear-gradient(90deg,rgba(255,112,130,.06),rgba(255,112,130,.015));border-top:1px solid #2d2730;border-bottom:1px solid #2d2730}.blocker b{font-size:10px}.blocker small{display:block;color:var(--muted);font-size:9px;line-height:1.8;margin-top:4px}.footer{margin-top:18px;color:#657b90;font-size:9px;line-height:1.9}.detail{display:none}.detail.active{display:block}.detail-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.back{border:1px solid var(--line);background:#0b1725;color:var(--muted);padding:9px 12px;border-radius:10px;cursor:pointer}.back:hover{color:var(--text);border-color:#3a5975}.detail h2{font-size:25px;margin:7px 0}.detail-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:15px}.phasebox{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.phase{padding:11px;border:1px solid var(--line);background:#091624;border-radius:10px;text-align:center}.phase small{display:block;color:var(--muted);font-size:8px;margin-bottom:6px}.domain{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#091624;margin:7px 0;font-size:10px}.snapshot{display:flex;flex-wrap:wrap;gap:6px}.tag{padding:6px 8px;background:#091624;border:1px solid var(--line);border-radius:8px;color:#9eb3c7;font-size:9px}@media(max-width:1100px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;border-left:0;border-bottom:1px solid var(--line);padding:15px}.side-foot{display:none}nav{grid-template-columns:repeat(3,1fr)}main{padding:22px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){nav{grid-template-columns:repeat(2,1fr)}.topbar,.detail-top{flex-direction:column}.release-pill{width:100%}.metrics,.tower-grid,.teams,.release-grid,.detail-grid{grid-template-columns:1fr}.phasebox{grid-template-columns:repeat(2,1fr)}main{padding:18px}h1{font-size:25px}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand"><div class="brand-mark"><div class="logo"></div><b>AFAGH VIRTUAL OFFICE</b></div><span>مرکز کنترل تماسهای مجازی AFAGH<br>Evidence-driven control plane</span></div><nav id="nav"></nav><div class="side-foot"><div class="online"><i class="dot"></i> CONTROL PLANE READY</div>EVIDENCE-FIRST ARCHITECTURE<br>Unverified data is never presented as proof.</div></aside><main id="app"></main></div>
<script>
const routes={dashboard:'مرکز کنترل تماسهای مجازی AFAGH',architecture:'معماری',organizations:'سازمان‌ها',business:'Business 360',ai:'AI Workforce',workflow:'Workflow',trust:'Trust & Security',evidence:'Evidence Center',governance:'Governance'};let evidence={},axes=[],matrix=[],teams=[];
const statusClass=s=>({PASS:'pass',PARTIAL:'partial',IN_PROGRESS:'in_progress',WAITING_EVIDENCE:'waiting_evidence',BLOCKED:'blocked',CONDITIONAL:'conditional',UNKNOWN:'unknown'}[s]||'unknown');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error(path);return r.json()}
async function load(){try{const [e,a,m,t]=await Promise.all([json('data/evidence.json'),json('data/architecture-axes.json'),json('data/phase-completion-board.json'),json('data/governance-control.json')]);evidence=e;axes=a.axes||[];matrix=m.axes||[];teams=t.teams||[]}catch(err){evidence={gate:'BLOCKED',production:'BLOCKED',architecture_contracts:{pass:0,total:0},runtime_evidence:{pass:0,total:0},verifier:{pass:0,total:0,blockers:1},blockers:[{id:'DATA-001',title:'Control data unavailable',reason:'Controlled data sources could not be loaded.'}]};axes=[];matrix=[];teams=[]}render()}
function nav(route){document.getElementById('nav').innerHTML=Object.entries(routes).map(([k,v])=>`<button class="${route===k?'active':''}" data-r="${k}">${v}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>location.hash=b.dataset.r)}
function metric(label,value,note,cls){return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value ${cls||''}">${esc(value)}</div><div class="metric-note">${note}</div></div>`}
function overall(m,a){const p=Object.values(m?.phases||{});return p.some(x=>x.status==='BLOCKED')?'BLOCKED':p.some(x=>x.status==='IN_PROGRESS')?'IN_PROGRESS':m?.status||a?.status||'UNKNOWN'}
function axisCard(a){const m=matrix.find(x=>x.id===a.id),s=overall(m,a);return `<div class="axis" data-axis="${esc(a.id)}"><div class="axis-head"><div><div class="code">${esc(a.id)}</div><h3>${esc(a.fa)} / ${esc(a.name)}</h3></div><span class="badge ${statusClass(s)}">${esc(s)}</span></div><p>${esc(a.purpose)}</p><div class="axis-foot"><span>Phase coverage ${Object.keys(m?.phases||{}).length}/4</span><span>${esc(a.gate||'CONTROL')}</span></div></div>`}
function teamCard(t){return `<div class="team"><div class="team-head"><div><h3>${esc(t.name)}</h3><div class="fa">${esc(t.fa)}</div></div><span class="badge ${statusClass(t.status)}">${esc(t.status)}</span></div><div class="team-meta"><b>Decision Authority:</b> ${esc(t.decision_authority)}<br><b>Next:</b> ${esc(t.next_action)}</div><div class="team-gates">${(t.open_gates||[]).map(g=>`<span class="gate-tag">${esc(g)}</span>`).join('')}</div></div>`}
function dashboard(){const e=evidence||{};return `<section id="dashboard"><div class="topbar"><div><div class="eyebrow">CONTROL PLANE / EVIDENCE-DRIVEN</div><h1>مرکز کنترل تماسهای مجازی AFAGH</h1><p class="lead">مرکز فرماندهی یکپارچه برای Architecture، Evidence، Verification، Governance و Release Control.</p></div><div class="release-pill"><small>RELEASE GATE</small><strong>${esc(e.gate||'UNKNOWN')}</strong><div>PRODUCTION — ${esc(e.production||'UNKNOWN')}</div></div></div><div class="metrics">${metric('Architecture Contracts',`${e.architecture_contracts?.pass??0}/${e.architecture_contracts?.total??0}`,'contract coverage','good')}${metric('Runtime Evidence',`${e.runtime_evidence?.pass??0}/${e.runtime_evidence?.total??0}`,'runtime verification','good')}${metric('Verifier',`${e.verifier?.pass??0}/${e.verifier?.total??0}`,'machine-checked','warn')}${metric('Active Blockers',e.verifier?.blockers??0,'release-impacting','bad')}</div><div class="section release-grid"><div class="gate-hero"><div class="gate-kicker">RELEASE DECISION</div><div class="gate-value">${esc(e.gate||'UNKNOWN')}</div><p class="gate-copy">تا زمانی که Gateهای اجباری و Evidence واقعی تأیید نشوند، P0-1 PASS صادر نمی‌شود. این صفحه فقط وضعیت Evidence را نمایش می‌دهد.</p></div><div class="card"><div class="section-head"><h2 class="section-title">Control Rules</h2><span class="section-sub">FAIL-CLOSED</span></div><div class="rules"><div class="rule"><span>Evidence</span><b class="good">REQUIRED</b></div><div class="rule"><span>Unverified proof</span><b class="bad">REJECTED</b></div><div class="rule"><span>P0-1 PASS</span><b class="bad">PROHIBITED</b></div><div class="rule"><span>Snapshot</span><b>${esc(e.snapshot_type||'CONTROLLED')}</b></div></div></div></div><div class="section"><div class="section-head"><h2 class="section-title">۱۰ محور معماری — Control Tower</h2><span class="section-sub">CLICK AN AXIS FOR DETAIL</span></div><div class="tower-grid">${axes.map(axisCard).join('')}</div></div><div class="section card"><div class="section-head"><h2 class="section-title">Architecture & Governance Control</h2><span class="section-sub">DECISION AUTHORITIES</span></div><div class="teams">${teams.map(teamCard).join('')}</div></div><div class="section card"><div class="section-head"><h2 class="section-title">Active Blockers</h2><span class="section-sub">NO MANUAL PASS</span></div><div class="blockers">${(e.blockers||[]).map(b=>`<div class="blocker"><b>${esc(b.id)} — ${esc(b.title)}</b><small>${esc(b.reason)}</small></div>`).join('')||'<div class="section-sub">No blocker recorded.</div>'}</div></div><div class="footer">Reviewed HEAD: ${esc(e.reviewed_head||'unknown')} · Snapshot: controlled / not live · Upstream: ${esc(e.pipeline?.upstream_connection||'unknown')}<br>EVIDENCE-DRIVEN CONTROL PLANE · Unverified data is never presented as proof.</div></section>`}
function detail(id){const a=axes.find(x=>x.id===id),m=matrix.find(x=>x.id===id);if(!a)return dashboard();const phases=m?.phases||{};return `<section class="detail active"><div class="detail-top"><div><div class="eyebrow">ARCHITECTURE AXIS / ${esc(a.id)}</div><h2>${esc(a.fa)} / ${esc(a.name)}</h2><p class="lead">${esc(a.purpose)}</p></div><button class="back" onclick="location.hash='dashboard'">بازگشت به Control Tower</button></div><div class="detail-grid"><div class="card"><div class="section-head"><h2 class="section-title">Phase State</h2><span class="section-sub">MACHINE-READABLE</span></div><div class="phasebox">${['Phase 1','Phase 2/2.5','Phase 3','Phase 4'].map(p=>{const x=phases[p]||{status:'UNKNOWN'};return `<div class="phase"><small>${p}</small><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span></div>`}).join('')}</div><div class="section"><div class="domain"><b>Gate:</b> ${esc(a.gate||'UNKNOWN')}</div><div class="domain"><b>Overall:</b> ${esc(overall(m,a))}</div></div></div><div class="card"><div class="section-head"><h2 class="section-title">Evidence Surface</h2><span class="section-sub">NO CLAIM WITHOUT EVIDENCE</span></div><div class="snapshot"><span class="tag">${esc(evidence.snapshot_type||'controlled')}</span><span class="tag">live: ${String(evidence.live??false)}</span><span class="tag">gate: ${esc(evidence.gate||'UNKNOWN')}</span></div><div class="footer">Status is derived from the controlled evidence model, not independently asserted by the UI.</div></div></div></section>`}
function simple(route){const names={architecture:'معماری',organizations:'سازمان‌ها',business:'Business 360',ai:'AI Workforce',workflow:'Workflow',trust:'Trust & Security',evidence:'Evidence Center',governance:'Governance'};return `<section class="detail active"><div class="detail-top"><div><div class="eyebrow">AFAGH VIRTUAL OFFICE / MODULE</div><h2>${names[route]||route}</h2><p class="lead">این سطح در Shell مرکزی تعریف شده و به لایه‌های Evidence و Governance متصل می‌شود.</p></div><button class="back" onclick="location.hash='dashboard'">بازگشت به Dashboard</button></div><div class="section card"><div class="section-head"><h2 class="section-title">Module Boundary</h2><span class="badge conditional">CONTROLLED</span></div><p class="lead">تا زمانی که منبع Evidence واقعی متصل نشده باشد، این ماژول وضعیت عملیاتی را به‌عنوان LIVE نمایش نمی‌دهد.</p></div></section>`}
function render(){const r=location.hash.slice(1)||'dashboard';nav(r);document.getElementById('app').innerHTML=r==='dashboard'?dashboard():axes.some(a=>a.id===r)?detail(r):simple(r);document.querySelectorAll('[data-axis]').forEach(x=>x.onclick=()=>location.hash=x.dataset.axis)}
window.addEventListener('hashchange',render);load();
</script></body></html>
