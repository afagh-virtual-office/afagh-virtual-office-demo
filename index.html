<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFAGH Virtual Office — Control Center</title>
<style>
:root{--bg:#08111f;--panel:#0d1a2d;--panel2:#10213a;--line:#1d3453;--text:#e8f0fa;--muted:#8fa4bd;--accent:#66d9ef;--good:#5ee6a8;--warn:#ffd166;--bad:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07101d,#0b1729);color:var(--text);font-family:Inter,Segoe UI,Tahoma,sans-serif}button{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-left:1px solid var(--line);background:#071321;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{padding:8px 10px 24px;border-bottom:1px solid var(--line);margin-bottom:14px}.brand b{display:block;font-size:16px;letter-spacing:.08em}.brand span{font-size:11px;color:var(--muted)}nav button{display:block;width:100%;border:0;background:transparent;color:var(--muted);text-align:right;padding:11px 12px;border-radius:9px;cursor:pointer;margin:3px 0}nav button:hover,nav button.active{background:var(--panel2);color:var(--text)}main{padding:26px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.12em}.top h1{margin:7px 0;font-size:30px}.top p{margin:0;color:var(--muted)}.status{border:1px solid #6d3140;background:#28141d;color:#ff9cab;padding:9px 13px;border-radius:9px;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(13,26,45,.9);border:1px solid var(--line);border-radius:13px;padding:18px}.metric{font-size:28px;font-weight:800;margin:8px 0}.label{color:var(--muted);font-size:12px}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.wide{grid-column:span 2}.section{margin-top:18px}.section h2{font-size:15px;margin:0 0 10px}.axes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.axis{padding:12px;background:#0a1627;border:1px solid var(--line);border-radius:9px}.axis b{display:block}.pill{font-size:10px;color:var(--bad)}.blocker{border-right:3px solid var(--bad);background:#160f18;padding:12px;margin:8px 0;border-radius:7px}.blocker b{display:block;margin-bottom:4px}.blocker small{color:var(--muted)}.team{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;font-size:12px}.hidden{display:none}.module{min-height:60vh}.module h2{font-size:25px}.module .card{margin-bottom:12px}.footer{margin-top:22px;color:#71869f;font-size:11px}.mobile{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;border-left:0;border-bottom:1px solid var(--line)}nav{display:grid;grid-template-columns:repeat(2,1fr)}main{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.axes{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 2}.top{flex-direction:column}.mobile{display:block}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}}
</style></head>
<body><div class="app">
<aside class="side"><div class="brand"><b>AFAGH VIRTUAL OFFICE</b><span>ARCHITECTURE CONTROL CENTER</span></div><nav id="nav"></nav><div class="footer">PUBLIC DEMO / SANDBOX<br>Not a production system.</div></aside>
<main><div id="app"></div></main></div>
<script>
const routes={dashboard:'داشبورد مرکزی',architecture:'معماری',organizations:'سازمان‌ها',business:'Business 360',ai:'AI Workforce',workflow:'Workflow',trust:'Trust & Security',evidence:'Evidence Center',governance:'Governance'};
let evidence=null;
async function loadEvidence(){try{evidence=await fetch('data/evidence.json',{cache:'no-store'}).then(r=>r.json())}catch(e){evidence={gate:'UNKNOWN',production:'UNKNOWN',note:'Evidence snapshot unavailable'}}render()}
function nav(){document.getElementById('nav').innerHTML=Object.entries(routes).map(([k,v])=>`<button class="${location.hash.slice(1)||'dashboard'}" data-r="${k}">${v}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.r})}
function stat(label,value,cls=''){return `<div class="card"><div class="label">${label}</div><div class="metric ${cls}">${value}</div></div>`}
function dashboard(){let e=evidence||{};return `<div class="top"><div><div class="eyebrow">CONTROL PLANE / EVIDENCE-DRIVEN</div><h1>مرکز کنترل معماری و محصول</h1><p>یک داشبورد مدیریتی که وضعیت را زیباتر نمی‌کند؛ فقط آنچه شواهد اجازه می‌دهند نشان می‌دهد.</p></div><div class="status">GATE 1 — ${e.gate||'UNKNOWN'}<br>PRODUCTION — ${e.production||'UNKNOWN'}</div></div><div class="grid">${stat('Architecture Contracts',`${e.architecture_contracts?.pass??0}/${e.architecture_contracts?.total??0}`,'good')}${stat('Runtime Evidence',`${e.runtime_evidence?.pass??0}/${e.runtime_evidence?.total??0}`,'good')}${stat('Fail-Closed Verifier',`${e.verifier?.pass??0}/${e.verifier?.total??0}`,'warn')}${stat('Active Blockers',e.verifier?.blockers??0,'bad')}</div><div class="section grid"><div class="card wide"><h2>ده محور معماری</h2><div class="axes">${Object.entries(e.axes||{}).map(([k,v])=>`<div class="axis"><b>${k}</b><span>Level ${v.level}</span><div class="pill">${v.status}</div></div>`).join('')}</div></div><div class="card wide"><h2>چهار تیم</h2>${['Team 1 — Architecture & Technology','Team 2 — Domain / Business / Trade','Team 3 — AI / Governance / Trust','Team 4 — Independent Architecture Audit'].map((x,i)=>`<div class="team"><span>${x}</span><b class="${i===3?'bad':'warn'}">${i===3?'BLOCKED':'CONDITIONAL'}</b></div>`).join('')}</div></div><div class="section card"><h2>Active Blockers</h2>${(e.blockers||[]).map(b=>`<div class="blocker"><b>${b.id} — ${b.title}</b><small>${b.reason}</small></div>`).join('')}</div><div class="footer">Reviewed HEAD: ${e.reviewed_head||'unknown'} · Run #${e.reviewed_run||'unknown'} · Snapshot: controlled / not live</div>`}
function modulePage(key){let titles={architecture:'Architecture Control',organizations:'Organizations',business:'Business 360',ai:'AI Workforce',workflow:'Workflow Orchestration',trust:'Trust & Security',evidence:'Evidence Center',governance:'Governance & ADR'};return `<div class="module"><div class="eyebrow">MODULE</div><h2>${titles[key]}</h2><div class="card"><b>STATUS: DESIGN_REVIEW</b><p class="label">این ماژول در Shell واقعی محصول تعریف شده است. داده عملیاتی فقط پس از اتصال به منبع معتبر نمایش داده خواهد شد.</p></div>${key==='evidence'?`<div class="card"><h3>Controlled Evidence Snapshot</h3><pre style="white-space:pre-wrap;color:#9fb4ca;font-size:11px">${JSON.stringify(evidence,null,2)}</pre></div>`:`<div class="card"><h3>Production guardrail</h3><p class="label">هیچ وضعیت سبزی بدون evidence معتبر تولید نمی‌شود. این Demo عمداً از جعل telemetry، PASS یا production readiness خودداری می‌کند.</p></div>`}</div>`}
function render(){nav();let r=location.hash.slice(1)||'dashboard';document.getElementById('app').innerHTML=r==='dashboard'?dashboard():modulePage(r in routes?r:'dashboard');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.r===r))}
window.addEventListener('hashchange',render);loadEvidence();
</script></body></html>
