<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFAGH — Settings</title><style>body{margin:0;background:#020916;color:#eef7ff;font-family:Segoe UI,Tahoma,Arial;padding:24px}.wrap{max-width:1100px;margin:auto}.card{background:#07182b;border:1px solid #173f60;border-radius:14px;padding:18px;margin-top:14px}.row{display:grid;grid-template-columns:220px 1fr;padding:11px 0;border-bottom:1px solid #153956}.muted{color:#8fa8c2}.ok{color:#8bf4c5}.warn{color:#ffc04c}</style><div class="wrap"><h1>System Settings</h1><div class="muted">Read-only operational configuration. Secrets are never displayed.</div><div class="card" id="box">Loading…</div></div><script>async function load(){const r=await fetch('/api/v1/modules/settings',{cache:'no-store'});const d=await r.json();document.querySelector('#box').innerHTML='<div class="row"><b>Status</b><span class="'+(d.status==='ACTIVE'?'ok':'warn')+'">'+d.status+'</span></div><div class="row"><b>Runtime Mode</b><span>'+d.runtime.mode+'</span></div><div class="row"><b>Release Class</b><span>'+d.runtime.releaseClass+'</span></div><div class="row"><b>Core Repository</b><span>'+d.repository.core+' / '+d.repository.branch+'</span></div><div class="row"><b>Database</b><span>'+d.database.configured+'</span></div><div class="row"><b>Communication Runtime</b><span>'+d.communication.url+'</span></div>'}load()</script>
