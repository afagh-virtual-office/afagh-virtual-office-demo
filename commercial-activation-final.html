<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFAGH — Final Commercial Activation Test</title><style>body{margin:0;background:#020814;color:#eef7ff;font-family:Segoe UI,Tahoma,Arial;padding:24px}.wrap{max-width:1200px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.title{font-size:28px;font-weight:900}.sub{color:#90a7bd;font-size:12px;margin-top:5px}.state{padding:9px 13px;border:1px solid #7a2c43;border-radius:999px;color:#ff8aa1}.ok{border-color:#1b6657;color:#58ead2}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.g{border:1px solid #19415f;border-radius:12px;background:#07182a;padding:14px}.g b{display:block;font-size:12px}.g span{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;border:1px solid #5e2437;color:#ff6c8b}.g span.ok{border-color:#1b6657;color:#58ead2}.g span.warn{border-color:#72501a;color:#ffc04c}.panel{margin-top:14px;border:1px solid #19415f;border-radius:14px;background:#061427;padding:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #2875a7;border-radius:9px;background:#0a2a45;color:#bdefff;padding:9px 12px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#5530ec,#157fff);color:#fff}.log{margin-top:12px;background:#030d19;border:1px solid #12344f;border-radius:10px;padding:12px;white-space:pre-wrap;font:12px/1.7 Consolas,monospace;min-height:200px}.note{color:#91a8bc;font-size:11px;line-height:1.8}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style><div class="wrap"><div class="head"><div><div class="title">AFAGH Commercial Activation — Final Test</div><div class="sub">Release-controlled runtime verification surface</div></div><div id="headline" class="state">BLOCKED</div></div><div id="grid" class="grid"></div><div class="panel"><div class="actions"><button class="btn primary" id="refresh">Run final readiness probe</button><a class="btn" href="./commercial-activation.html">Open control console</a></div><p class="note">این صفحه PASS تولید نمی‌کند. تنها نتیجه‌ای را نمایش می‌دهد که Runtime از Endpoint و Evidence واقعی برگرداند. فعال‌سازی تجارت واقعی فقط با G09_AUTHORIZED مجاز است.</p><div id="log" class="log">Ready.</div></div></div><script>const endpoint='https://afagh-communication-os-runtime.onrender.com/api/v1/release/readiness';const names={G01:'DB Connection',G02:'Migration',G03:'Communication Health',G04:'Provider Verification',G05:'Controlled Virtual Expert Communication',G06:'Evidence Persistence',G07:'Security / Authorization Evidence',G08:'Production Release Gate',G09:'Commercial Activation'};const cls=s=>s==='PASS'||s==='AUTHORIZED'?'ok':s==='UNKNOWN'?'warn':'';async function run(){document.getElementById('log').textContent='Running runtime readiness probe…';try{const r=await fetch(endpoint,{cache:'no-store'});const d=await r.json();const gates=d.gates||{};document.getElementById('grid').innerHTML=Object.entries(names).map(([k,v])=>`<div class="g"><b>${k} · ${v}</b><span class="${cls(gates[k]||'UNKNOWN')}">${gates[k]||'UNKNOWN'}</span></div>`).join('');const live=d.commercial_activation?.status==='AUTHORIZED';const h=document.getElementById('headline');h.textContent=live?'COMMERCIAL ACTIVATION AUTHORIZED':'PRODUCTION BLOCKED';h.className='state '+(live?'ok':'');document.getElementById('log').textContent=JSON.stringify(d,null,2)}catch(e){document.getElementById('headline').textContent='PROBE UNAVAILABLE';document.getElementById('log').textContent=String(e)}}document.getElementById('refresh').onclick=run;run();</script></html>
