services:
  - type: web
    name: afagh-p0-1-runtime
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --prefix runtime/p0-1 --omit=dev
    startCommand: node runtime/p0-1/server.mjs
    healthCheckPath: /api/v1/health
    envVars:
      - key: AFAGH_RUNTIME_MODE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: afagh-p0-1-db
          property: connectionString
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_REDIRECT_URI
        sync: false
      - key: SESSION_TTL_SECONDS
        value: "3600"

  - type: web
    name: afagh-communication-os-runtime
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install --prefix runtime/communication-os --omit=dev
    startCommand: node runtime/communication-os/migrate.mjs && node runtime/communication-os/server.js
    healthCheckPath: /api/v1/communication/health
    envVars:
      - key: AFAGH_RUNTIME_MODE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: afagh-p0-1-db
          property: connectionString
      - key: SOURCE_BUILD
        sync: false
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: afagh-p0-1-db
    databaseName: afagh_p0_1_db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
